<html lang="en">

    <meta charset="utf-8" />

    <title>2026 Topps Football Checklist</title>

    <style>
      :root {
        --turf: #1d4d2b; --turf-deep: #133820; --paper: #f2f5f2; --card: #ffffff;
        --ink: #1b2320; --muted: #5b6a61; --line: #d6dcd7; --gold: #e3a72f; --have: #e6f3e8;
        --display: "Oswald", "Arial Narrow", Impact, sans-serif;
        --body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); line-height: 1.4; }

      /* Top bar: field green with yard-line stripes */
      .top { background: var(--turf);
        background-image: repeating-linear-gradient(90deg, transparent 0 59px, rgba(255,255,255,.07) 59px 61px);
        color: #fff; padding: 1.25rem 1rem 1rem; }
      .wrap { max-width: 760px; margin: 0 auto; }
      h1 { font-family: var(--display); font-weight: 700; font-size: 2rem; margin: 0 0 .5rem; letter-spacing: .01em; }
      .total { display: flex; justify-content: space-between; align-items: baseline; font-size: .95rem; margin-bottom: .35rem; }
      .total strong { font-family: var(--display); font-size: 1.4rem; font-weight: 500; }
      .bar { height: 10px; background: rgba(255,255,255,.22); border-radius: 5px; overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s; }

      .toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; flex-wrap: wrap; }
      .auth { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; font-size: .85rem; max-width: 100%; }
      .me { display: flex; align-items: center; gap: .5rem; color: #fff; font-weight: 600; }
      .avatar { width: 28px; height: 28px; border-radius: 50%; }
      #authBtn { background: #fff; color: var(--turf-deep); border: 0; border-radius: 8px; padding: .5rem .9rem; font-size: .9rem; font-weight: 600; cursor: pointer; }
      #status { color: rgba(255,255,255,.85); min-height: 1.2em; text-align: right; }
      #status.bad { color: #ffd2cc; }
      /* Sticky controls */
      .controls { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); padding: .6rem 1rem .5rem; }
      .row { display: flex; gap: .5rem; margin-bottom: .5rem; }
      #search { flex: 1; min-width: 0; padding: .6rem .8rem; font-size: 1rem; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
      .seg button { border: 0; background: none; padding: .55rem .8rem; font-size: .9rem; cursor: pointer; color: var(--muted); }
      .seg button[aria-pressed="true"] { background: var(--turf); color: #fff; }
      .tabs { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .2rem; }
      .tabs button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: .4rem .85rem; font-size: .9rem; cursor: pointer; color: var(--ink); }
      .tabs button[aria-pressed="true"] { background: var(--turf-deep); color: #fff; border-color: var(--turf-deep); }
      .tabs small { opacity: .7; margin-left: .3rem; }

      main { padding: 1rem; }
      details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: .6rem; overflow: hidden; }
      summary { list-style: none; cursor: pointer; padding: .7rem .9rem; display: grid; grid-template-columns: 1fr auto; gap: .2rem .75rem; align-items: center; }
      summary::-webkit-details-marker { display: none; }
      summary::before { content: "▸"; position: absolute; margin-left: -.1rem; opacity: 0; }
      .sname { font-weight: 600; }
      .scount { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
      .sbar { grid-column: 1 / -1; height: 5px; background: #e5e9e6; border-radius: 3px; overflow: hidden; }
      .sbar > i { display: block; height: 100%; width: 0; background: var(--turf); }
      details.done .sbar > i { background: var(--gold); }
      details.done .scount { color: var(--turf); font-weight: 600; }
      details[open] summary { border-bottom: 1px solid var(--line); background: #fafbfa; }

      ul { list-style: none; margin: 0; padding: 0; }
      li.hide, details.hide, .group.hide { display: none; }
      li label { display: flex; align-items: center; gap: .7rem; padding: .55rem .9rem; cursor: pointer; border-top: 1px solid #edf0ed; }
      li:first-child label { border-top: 0; }
      li.have label { background: var(--have); }
      input[type=checkbox] { width: 1.25rem; height: 1.25rem; flex: none; accent-color: var(--turf); }
      body:not(.logged-in) input[type=checkbox] {
  display: none;
}

body:not(.logged-in) li label {
  cursor: default;
}
      .num { flex: none; min-width: 3.4rem; text-align: center; font-size: .8rem; font-variant-numeric: tabular-nums;
             background: #eef1ee; border-radius: 6px; padding: .15rem .35rem; color: var(--muted); }
      .who { flex: 1; min-width: 0; }
      .who b { font-weight: 600; }
      .who span { display: block; font-size: .85rem; color: var(--muted); }
      .tag { flex: none; font-size: .75rem; background: #fff3d6; color: #7a5200; border-radius: 999px; padding: .1rem .5rem; }
      .empty { text-align: center; color: var(--muted); padding: 2rem 0; }
      @media (max-width: 480px) { h1 { font-size: 1.6rem; } .tag { display: none; } }
    </style>
